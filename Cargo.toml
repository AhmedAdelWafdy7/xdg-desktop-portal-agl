[package]
name = "xdg-desktop-portal-agl"
version = "0.1.0"
authors = ["Ahmed Wafdy <ahmedadelwafdy782@gmail.com>"]
edition = "2024"
# edition 2024 needs 1.85; u32::is_multiple_of (weston.rs) needs 1.87.
rust-version = "1.87"
description = "XDG Desktop Portal backend for AGL (Automotive Grade Linux)"
repository = "https://github.com/AhmedAdelWafdy7/xdg-desktop-portal-agl"
license = "GPL-2.0-or-later"
build = "build.rs"  

[[bin]]
name = "xdg-desktop-portal-agl"
path = "src/main.rs"

[lib]
name = "wayland_capture"
path = "src/wayland_capture/lib.rs"

[dependencies]
zbus               = { version = "5.1.1", features = ["tokio"] }
tokio              = { version = "1.50", features = ["rt", "macros", "signal"] }
tracing            = "0.1"
tracing-subscriber = "0.3"
anyhow             = "1.0"
thiserror          = "2.0"
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.2", features = ["client"] }
wayland-scanner = "0.31"
wayland-backend = "0.3"
libc = "0.2.186"
png = "0.17"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "pixel_pipeline"
harness = false

[profile.release]
# Cross-crate inlining/dead-code elimination — meaningfully shrinks a small, single-purpose
# daemon binary. panic stays "unwind" (the default): a capture panicking degrades to a D-Bus
# error response and the daemon keeps serving (see spawn_blocking's Err arm in screenshot.rs) —
# panic="abort" would turn that into the whole portal dying, not worth it for the RSS/size win.
lto = true
codegen-units = 1
strip = true
